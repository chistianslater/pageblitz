<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Warmes Patina-Placeholder: Terrakotta-Bogenform vor Pergamentgrund">
  <!-- Pergamentgrund, flache Formen, keine Gradients/Filter/Opacity -->
  <rect x="0" y="0" width="1200" height="900" fill="#EFE5D2" />

  <!-- Sand-Bänder als Flat-Shapes -->
  <rect x="0" y="0" width="1200" height="120" fill="#E0D3B8" />
  <rect x="0" y="780" width="1200" height="120" fill="#E0D3B8" />

  <!-- Große Bogenform, Terrakotta, flach gestapelt (Andeutung von Tiefe ohne Gradient) -->
  <path d="M 260 900 L 260 420 A 340 340 0 0 1 940 420 L 940 900 Z" fill="#8F6C3A" />
  <path d="M 320 900 L 320 440 A 280 280 0 0 1 880 440 L 880 900 Z" fill="#B05A36" />
  <path d="M 390 900 L 390 470 A 210 210 0 0 1 810 470 L 810 900 Z" fill="#D9A184" />

  <!-- Sonnenkreis oberhalb des Bogens -->
  <circle cx="600" cy="220" r="70" fill="#B05A36" />
</svg>
