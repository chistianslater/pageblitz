<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Warmes Zunft-Placeholder: gestapelte Brotlaibe vor Bordeaux-Fläche">
  <!-- Leinensack-Grund, flache Formen, keine Gradients/Filter/Opacity -->
  <rect x="0" y="0" width="1200" height="900" fill="#EDE3CE" />

  <!-- Bordeaux-Bühnenfläche -->
  <rect x="0" y="560" width="1200" height="340" fill="#5E1F22" />

  <!-- Drei Brotlaib-Kreise, versetzt, gestapelt -->
  <circle cx="360" cy="560" r="170" fill="#8F6C3A" />
  <circle cx="360" cy="560" r="130" fill="#C9A468" />

  <circle cx="620" cy="600" r="200" fill="#2A2118" />
  <circle cx="620" cy="600" r="160" fill="#8F6C3A" />
  <circle cx="620" cy="600" r="120" fill="#C9A468" />

  <circle cx="900" cy="570" r="150" fill="#8F6C3A" />
  <circle cx="900" cy="570" r="112" fill="#C9A468" />

  <!-- Siegelgold-Ring um den mittleren Laib -->
  <circle cx="620" cy="600" r="200" fill="none" stroke="#7A5818" stroke-width="4" />
</svg>
