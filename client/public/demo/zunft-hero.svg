<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Warmes Zunft-Placeholder: Brotlaib-Kreis vor Mehlweiß-Grund">
  <!-- Mehlweiß-Grund, flache Formen, keine Gradients/Filter/Opacity -->
  <rect x="0" y="0" width="1200" height="900" fill="#F5EFE2" />

  <!-- Sandbänder als Flat-Shapes -->
  <rect x="0" y="0" width="1200" height="110" fill="#EDE3CE" />
  <rect x="0" y="790" width="1200" height="110" fill="#EDE3CE" />

  <!-- Großer Brotlaib-Kreis, flach gestapelt (Andeutung von Kruste ohne Gradient) -->
  <circle cx="600" cy="450" r="300" fill="#2A2118" />
  <circle cx="600" cy="450" r="270" fill="#8F6C3A" />
  <circle cx="600" cy="450" r="220" fill="#C9A468" />
  <circle cx="600" cy="450" r="170" fill="#EDE3CE" />

  <!-- Siegelgold-Ring wie ein Zunft-Siegel -->
  <circle cx="600" cy="450" r="270" fill="none" stroke="#7A5818" stroke-width="4" />

  <!-- Einschnitte im Laib, hart -->
  <rect x="592" y="220" width="16" height="140" fill="#2A2118" />
  <rect x="500" y="260" width="16" height="120" fill="#2A2118" />
  <rect x="684" y="260" width="16" height="120" fill="#2A2118" />

  <!-- Bordeaux-Bänder links/rechts -->
  <rect x="80" y="620" width="220" height="18" fill="#5E1F22" />
  <rect x="900" y="620" width="220" height="18" fill="#5E1F22" />
</svg>
