<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Erdiges Landgut-Placeholder: drei Pflanzreihen-Bögen unterschiedlicher Höhe vor Leinengrund">
  <!-- Beetgrund (Surface, bewusst abweichend vom Seiten-Canvas, sonst verschwindet die
       Bogen-Maske optisch auf gleichfarbigem Grund), flache Formen, keine Gradients/Filter/Opacity -->
  <rect x="0" y="0" width="1200" height="900" fill="#EDE8D9" />

  <!-- Furche-Band am oberen Rand -->
  <rect x="0" y="0" width="1200" height="90" fill="#DCD3BC" />

  <!-- Drei Pflanzreihen-Bögen unterschiedlicher Höhe, flache Blattgrün-/Sandtöne -->
  <path d="M 30 900 L 30 430 A 150 150 0 0 1 180 280 L 220 280 A 150 150 0 0 1 370 430 L 370 900 Z" fill="#41593A" />
  <path d="M 430 900 L 430 670 A 150 150 0 0 1 580 520 L 620 520 A 150 150 0 0 1 770 670 L 770 900 Z" fill="#C9BC8F" />
  <path d="M 830 900 L 830 550 A 150 150 0 0 1 980 400 L 1020 400 A 150 150 0 0 1 1170 550 L 1170 900 Z" fill="#8FA872" />
</svg>
