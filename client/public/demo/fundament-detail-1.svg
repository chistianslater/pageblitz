<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marine Fassaden-Placeholder mit Katasterraster">
  <!-- Marine-Grund, flache Formen, keine Gradients/Filter/Opacity -->
  <rect x="0" y="0" width="1200" height="900" fill="#14263F" />

  <!-- Fassadenblöcke, gestaffelt in Grau/Marine -->
  <rect x="0" y="0" width="600" height="900" fill="#1B324F" />
  <rect x="600" y="0" width="600" height="900" fill="#243C5E" />

  <!-- Katasterraster: harte 1px-Linien, kein Dithering -->
  <rect x="0" y="98" width="1200" height="2" fill="#5A6A80" />
  <rect x="0" y="198" width="1200" height="2" fill="#5A6A80" />
  <rect x="0" y="298" width="1200" height="2" fill="#5A6A80" />
  <rect x="0" y="398" width="1200" height="2" fill="#5A6A80" />
  <rect x="0" y="498" width="1200" height="2" fill="#5A6A80" />
  <rect x="0" y="598" width="1200" height="2" fill="#5A6A80" />
  <rect x="0" y="698" width="1200" height="2" fill="#5A6A80" />
  <rect x="0" y="798" width="1200" height="2" fill="#5A6A80" />
  <rect x="98" y="0" width="2" height="900" fill="#5A6A80" />
  <rect x="298" y="0" width="2" height="900" fill="#5A6A80" />
  <rect x="498" y="0" width="2" height="900" fill="#5A6A80" />
  <rect x="698" y="0" width="2" height="900" fill="#5A6A80" />
  <rect x="898" y="0" width="2" height="900" fill="#5A6A80" />
  <rect x="1098" y="0" width="2" height="900" fill="#5A6A80" />

  <!-- Fenster als Messing-Blöcke, hart -->
  <rect x="150" y="150" width="80" height="110" fill="#7A5F2E" />
  <rect x="350" y="150" width="80" height="110" fill="#7A5F2E" />
  <rect x="150" y="360" width="80" height="110" fill="#7A5F2E" />
  <rect x="350" y="360" width="80" height="110" fill="#7A5F2E" />
  <rect x="770" y="240" width="80" height="110" fill="#7A5F2E" />
  <rect x="970" y="240" width="80" height="110" fill="#7A5F2E" />
  <rect x="770" y="450" width="80" height="110" fill="#7A5F2E" />
  <rect x="970" y="450" width="80" height="110" fill="#7A5F2E" />
</svg>
