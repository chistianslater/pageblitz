  <rect x="170" y="360" width="90" height="400" fill="#5A6A80" />
  <rect x="270" y="560" width="70" height="200" fill="#14263F" />
  <rect x="350" y="260" width="140" height="500" fill="#14263F" />
  <rect x="500" y="420" width="100" height="340" fill="#5A6A80" />
  <rect x="610" y="180" width="110" height="580" fill="#14263F" />
  <rect x="730" y="440" width="80" height="320" fill="#5A6A80" />
  <rect x="820" y="340" width="130" height="420" fill="#14263F" />
  <rect x="960" y="520" width="90" height="240" fill="#5A6A80" />
  <rect x="1060" y="400" width="110" height="360" fill="#14263F" />

  <!-- Fenster als Messing-Rasterpunkte, hart -->
  <rect x="360" y="300" width="18" height="18" fill="#7A5F2E" />
  <rect x="400" y="300" width="18" height="18" fill="#7A5F2E" />
  <rect x="440" y="300" width="18" height="18" fill="#7A5F2E" />
  <rect x="360" y="350" width="18" height="18" fill="#7A5F2E" />
  <rect x="440" y="350" width="18" height="18" fill="#7A5F2E" />
  <rect x="630" y="220" width="16" height="16" fill="#7A5F2E" />
  <rect x="670" y="220" width="16" height="16" fill="#7A5F2E" />
  <rect x="630" y="270" width="16" height="16" fill="#7A5F2E" />
  <rect x="670" y="270" width="16" height="16" fill="#7A5F2E" />
  <rect x="840" y="380" width="16" height="16" fill="#7A5F2E" />
