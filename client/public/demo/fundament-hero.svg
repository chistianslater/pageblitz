<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marine Stadtsilhouette-Placeholder aus flachen Blöcken">
  <!-- Weißgrund, flache Formen, keine Gradients/Filter/Opacity -->
  <rect x="0" y="0" width="1200" height="900" fill="#EEF1F5" />

  <!-- Himmelband oben, hart -->
  <rect x="0" y="0" width="1200" height="60" fill="#D5DBE3" />

  <!-- Bodenlinie -->
  <rect x="0" y="760" width="1200" height="140" fill="#5A6A80" />

  <!-- Stadtsilhouette: gestaffelte Gebäudeblöcke, Marine/Grau, hart geschnitten -->
