<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Erdiges Landgut-Placeholder: Kräutertöpfe in einer Reihe vor Sand-Band">
  <!-- Beetgrund, flache Formen, keine Gradients/Filter/Opacity -->
  <rect x="0" y="0" width="1200" height="900" fill="#EDE8D9" />

  <!-- Sand-Band als Verkaufstisch -->
  <rect x="0" y="560" width="1200" height="340" fill="#C9BC8F" />
  <rect x="0" y="560" width="1200" height="20" fill="#41593A" />

  <!-- Vier Kräutertöpfe, flach gestapelt -->
  <rect x="130" y="470" width="140" height="110" rx="10" fill="#8F6C3A" />
  <rect x="150" y="380" width="20" height="110" fill="#41593A" />
  <rect x="200" y="360" width="20" height="130" fill="#4A6741" />
  <rect x="240" y="390" width="20" height="100" fill="#41593A" />

  <rect x="410" y="450" width="140" height="130" rx="10" fill="#6D6656" />
  <rect x="440" y="340" width="20" height="130" fill="#4A6741" />
  <rect x="480" y="370" width="20" height="100" fill="#8FA872" />

  <rect x="690" y="480" width="140" height="100" rx="10" fill="#8F6C3A" />
  <rect x="720" y="400" width="20" height="100" fill="#41593A" />
  <rect x="760" y="420" width="20" height="80" fill="#4A6741" />

  <rect x="970" y="460" width="140" height="120" rx="10" fill="#6D6656" />
  <rect x="1000" y="360" width="20" height="120" fill="#8FA872" />
  <rect x="1040" y="390" width="20" height="90" fill="#4A6741" />
</svg>
