<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flaches Graustufen-Placeholder mit diagonalem Panel und roter Diagonalkante">
  <rect x="0" y="0" width="1200" height="900" fill="#D8D8D3" />

  <!-- Diagonales Panel (Markenshooting-Andeutung), harte Kanten, kein Gradient -->
  <polygon points="0,900 0,300 1200,0 1200,900" fill="#3A3A38" />
  <polygon points="0,900 0,540 1200,240 1200,900" fill="#8A8A85" />
  <polygon points="0,900 0,760 1200,460 1200,900" fill="#B4B4AE" />

  <!-- Rote Diagonalkante -->
  <polygon points="0,296 0,304 1200,4 1200,-4" fill="#E0301E" />
</svg>
