<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verspieltes Marktplatz-Placeholder: bunte Bonbon-Formen vor Vanillegrund">
  <!-- Vanillegrund, flache Formen, keine Gradients/Filter/Opacity -->
  <rect x="0" y="0" width="1200" height="900" fill="#FFF8EC" />

  <!-- Große Bonbon-Kreise -->
  <circle cx="880" cy="260" r="230" fill="#C4442E" />
  <circle cx="260" cy="640" r="190" fill="#3E8E7E" />
  <circle cx="220" cy="180" r="110" fill="#FFC838" />

  <!-- Bonbon-Dreiecke -->
  <polygon points="620,760 760,520 900,760" fill="#FFC838" />
  <polygon points="960,700 1060,540 1160,700" fill="#3E8E7E" />
  <polygon points="60,420 150,280 240,420" fill="#C4442E" />

  <!-- Kleine Konfetti-Kreise -->
  <circle cx="560" cy="180" r="34" fill="#3E8E7E" />
  <circle cx="1080" cy="380" r="26" fill="#C4442E" />
  <circle cx="420" cy="820" r="30" fill="#FFC838" />
</svg>
