<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dunkles Trattoria-Placeholder: Nudelteller-Detail">
  <!-- Espresso-Bühnengrund, flache Formen, keine Gradients/Filter/Opacity -->
  <rect x="0" y="0" width="1200" height="900" fill="#16110D" />

  <!-- Großer Teller-Kreis, mittig -->
  <circle cx="600" cy="450" r="320" fill="#241C15" />
  <circle cx="600" cy="450" r="260" fill="#6E4A2A" />
  <circle cx="600" cy="450" r="200" fill="#3A2F22" />

  <!-- Goldring -->
  <circle cx="600" cy="450" r="320" fill="none" stroke="#C99B4A" stroke-width="4" />

  <!-- Pasta-Andeutung: flache Streifen im Zentrum -->
  <rect x="480" y="410" width="240" height="16" fill="#B9A88F" />
  <rect x="500" y="440" width="200" height="16" fill="#B9A88F" />
  <rect x="470" y="470" width="260" height="16" fill="#B9A88F" />
</svg>
