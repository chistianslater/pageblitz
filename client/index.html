<!doctype html>
<html lang="de" translate="no">

  <head>
    <meta charset="UTF-8" />
    <!-- Translate verhindern: schützt React vor DOM-Konflikten durch Google Translate u.a. Übersetzer -->
    <meta name="google" content="notranslate">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KI-Website erstellen für Kleinunternehmen | Pageblitz</title>
    <meta name="description" content="Website in 3 Minuten mit KI erstellen. Professionelle Website für Friseur, Restaurant, Handwerker &amp; mehr. Ab 19,90 €/Monat. 7 Tage gratis testen.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://pageblitz.de/">
    <!-- Open Graph -->
    <meta property="og:title" content="KI-Website in 3 Minuten – Pageblitz">
    <meta property="og:description" content="Professionelle Website für dein Unternehmen. KI erstellt, sofort online. Ab 19,90 €/Monat – 7 Tage gratis.">
    <meta property="og:image" content="https://pageblitz.de/og-image.jpg">
    <meta property="og:url" content="https://pageblitz.de">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="de_DE">
    <meta property="og:site_name" content="Pageblitz">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="KI-Website in 3 Minuten – Pageblitz">
    <meta name="twitter:description" content="Professionelle Website für dein Unternehmen. KI erstellt, sofort online. Ab 19,90 €/Monat.">
    <meta name="twitter:image" content="https://pageblitz.de/og-image.jpg">
    <!-- Schema.org: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Pageblitz",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "19.90",
        "priceCurrency": "EUR",
        "priceValidUntil": "2027-12-31"
      },
      "description": "KI-Website-Generator für deutsche Kleinunternehmen – in 3 Minuten professionell online",
      "inLanguage": "de",
      "url": "https://pageblitz.de",
      "publisher": {
        "@type": "Organization",
        "name": "Pageblitz",
        "url": "https://pageblitz.de"
      }
    }
    </script>
    <!-- Schema.org: Organization (enables Google Knowledge Panel & sitelinks) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Pageblitz",
      "url": "https://pageblitz.de",
      "logo": "https://pageblitz.de/og-image.jpg",
      "description": "KI-Website-Generator für deutsche Kleinunternehmen – in 3 Minuten professionell online.",
      "foundingDate": "2025",
      "areaServed": "DE",
      "inLanguage": "de",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "hallo@pageblitz.de",
        "availableLanguage": "German"
      },
      "sameAs": [
        "https://www.instagram.com/pageblitz.de"
      ]
    }
    </script>
    <!--
      FAQPage-Schema wird serverseitig aus shared/faq.ts injiziert (siehe
      server/seo/homePage.ts). Vorher stand die Liste hier hartkodiert und war
      von den tatsächlich gerenderten FAQs abgewichen – von sechs Fragen stimmte
      genau eine überein. Bitte nicht wieder hier eintragen.
    -->
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#18181b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- App-Body-Fonts (blocking – needed for first paint of app shell):
         Inter/Plus Jakarta Sans. v2-Style-Packs bringen ihre eigenen Fonts
         mit (SSR-Head aus der Pack-Verfassung bzw. client/src/lib/packFonts.ts
         im CSR-Fallback). -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Google Consent Mode v2 – defaults BEFORE any gtag config -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
    </script>
    <!-- Google Ads Conversion Tracking (AW-16545728698) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16545728698"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'AW-16545728698');
    </script>
    <!-- Rybbit Analytics (cookieless, no consent required) -->
    <script src="https://app.rybbit.io/api/script.js" data-site-id="2ea5c59b5deb" defer></script>
    <!-- GA4, Clarity, Meta Pixel are loaded dynamically after cookie consent (see consent.ts) -->
    <!-- Überschriften-/Studio-Fonts – async/non-blocking, damit sie nicht auf dem kritischen Rendering-Pfad des ersten Paints liegen: Space Grotesk (h1–h6 sitewide, siehe client/src/index.css @layer base; fällt bis zum Laden auf Inter zurück, font-display: swap) + Fraunces/Instrument Sans (nur der Studio-Editor, onboarding-v2/studio.css --st-display/--st-ui). Der frühere riesige Preload hier lud 20+ v1-Layout-Familien (v1 seit B4b entfernt) + Fontshare Clash Display/Satoshi (0 Verwendungen) mit. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,300;1,9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,300;1,9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" /></noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
