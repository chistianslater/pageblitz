    <!-- Pre-Paint-Hintergrund: jede Route malt sofort ihren eigenen Grund,
         bevor React/CSS greifen. Synchron und winzig — bewusst VOR allem
         anderen.

         Seit dem Klarstart-Relaunch sind Landing und Funnel hell; die alte
         Liste malte dort weiter Kohle (#0b0b0d) und damit genau den Blitz,
         den sie verhindern sollte — nur andersherum. Werte muessen zum
         tatsaechlichen Grund der Route passen:
           /            .klarstart-live  → #fff    (clear-flow.css)
           /start       .start-klarstart → #fff    (start-klarstart.css)
           /onboarding  .pb-studio       → #fff    (--st-canvas, studio.css)
           /login       bg-lp-canvas     → #f7f5f1 (--lp-canvas, index.css)
         Impressum/Datenschutz sind weiterhin dunkel. -->
    <script>
      (function () {
        var p = location.pathname;
        var bg = "#f3efe7";
        if (
          p === "/" ||
          p.indexOf("/start") === 0 ||
          p.indexOf("/onboarding") === 0
        )
          bg = "#ffffff";
        else if (p.indexOf("/login") === 0) bg = "#f7f5f1";
        else if (p === "/impressum" || p === "/datenschutz") bg = "#0a0a0f";
        document.documentElement.style.background = bg;
      })();
    </script>

    <!-- Eine Schrift für das ganze System (Landing, Studio, Dashboard): Space Grotesk,
         self-hosted (B6 Task 8) — eine Variable-Font-Datei (wght 300–700, Subset latin,
         22 kB) aus client/public/fonts/, @font-face mit font-display: swap in
         client/src/index.css. Preload, damit der Browser sie nicht erst nach dem
         CSS-Parse entdeckt (kein Google-Fonts-Request mehr auf "/"). v2-Style-Packs
         bringen ihre eigenen Fonts mit (SSR-Head aus der Pack-Verfassung bzw.
         client/src/lib/packFonts.ts im CSR-Fallback). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin-wght.woff2" crossorigin />
    <!-- Google Consent Mode v2 – defaults BEFORE any gtag config. Der gtag-Stub
         steht synchron hier, damit frühe gtag()-Aufrufe (consent.ts, tracking.ts)
         in dataLayer landen, bevor gtag.js geladen ist. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      gtag('js', new Date());
      gtag('config', 'AW-16545728698');
    </script>
    <!-- Third-Party-Skripte erst NACH dem ersten Paint (B6 Task 8): Google Ads
         gtag.js (AW-16545728698, ~180 KB) und Rybbit Analytics (cookielos) wurden
         vorher als async/defer im <head> angefordert und konkurrierten auf dem
         mobilen Netz mit CSS/Font/JS um Bandbreite (Lighthouse: im LCP-Pfad).
         Jetzt: nach `load` + requestIdleCallback (Fallback 1,5 s). Conversions
         gehen nicht verloren — gtag() queued in dataLayer, bis gtag.js da ist;
         Rybbit zählt den Pageview beim Laden. GA4, Clarity, Meta Pixel laden
         weiterhin erst nach Cookie-Einwilligung (client/src/lib/consent.ts). -->
    <script>
      (function () {
        function loadThirdParty() {
          var g = document.createElement('script');
          g.async = true;
          g.src = 'https://www.googletagmanager.com/gtag/js?id=AW-16545728698';
          document.head.appendChild(g);
          var r = document.createElement('script');
          r.defer = true;
          r.src = 'https://app.rybbit.io/api/script.js';
          r.setAttribute('data-site-id', '2ea5c59b5deb');
          document.head.appendChild(r);
        }
        function schedule() {
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadThirdParty, { timeout: 1500 });
          } else {
            setTimeout(loadThirdParty, 1500);
          }
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
      })();
    </script>
